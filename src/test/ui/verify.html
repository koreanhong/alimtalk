<!doctype html>
<html><head><meta charset="utf-8"></head><body>
<pre id="out">running</pre>
<iframe id="f" src="/index.html" style="width:1200px;height:900px"></iframe>
<script>
const results = [];
const errors = [];
const sleep = (ms) => new Promise(r => setTimeout(r, ms));
const rec = (name, pass, detail) => results.push({ name, pass: !!pass, detail: String(detail == null ? "" : detail) });
const f = document.getElementById("f");
f.addEventListener("load", async () => {
  const w = f.contentWindow, d = w.document, $ = (id) => d.getElementById(id);
  w.addEventListener("error", e => errors.push(String(e.message)));
  try { w.localStorage.clear(); } catch (e) {}
  await sleep(500);

  /* ---------- 공통 도구 ---------- */
  const q = (sel, root) => (root || d).querySelector(sel);
  const qa = (sel, root) => [...(root || d).querySelectorAll(sel)];
  const shown = (el) => w.getComputedStyle(el).display !== "none";
  /* 화면에 실제로 보이는지 (hidden 속성·display·부모 숨김 모두 반영) */
  const vis = (el) => !!el && !el.hidden && w.getComputedStyle(el).display !== "none" && w.getComputedStyle(el).visibility !== "hidden" && el.getClientRects().length > 0;
  const txt = (el) => el ? el.textContent.replace(/\s+/g, " ").trim() : "";
  async function waitFor(fn, ms = 3000){
    const t0 = Date.now();
    while (Date.now() - t0 < ms){ try { if (fn()) return true; } catch (e) {} await sleep(50); }
    return false;
  }
  const need = (el, what) => { if (!el) throw new Error(what + " 없음"); return el; };
  /* 블록 하나가 예외로 멈춰도 그 블록의 항목은 FAIL로 기록하고 다음 블록으로 넘어간다 */
  async function block(names, fn){
    const start = results.length;
    let err = null;
    try { await fn(); } catch (e) { err = e; }
    const done = new Set(results.slice(start).map(r => r.name));
    for (const n of names) if (!done.has(n)) rec(n, false, err ? "error: " + (err.message || err) : "not checked");
  }
  async function fakeImage(input){
    const c = d.createElement("canvas"); c.width = 40; c.height = 40;
    const blob = await new Promise(r => c.toBlob(r, "image/png"));
    const dt = new w.DataTransfer(); dt.items.add(new w.File([blob], "x.png", { type: "image/png" }));
    input.files = dt.files; input.dispatchEvent(new w.Event("change"));
    await sleep(300);
  }

  /* fetch 감시: /api/templates/chat 요청 본문을 기록하고, 필요하면 지연·오류 응답으로 바꾼다 (서버 코드는 그대로) */
  const chatReqs = [];
  let generateCalls = 0;
  let fetchHook = null;
  const realFetch = w.fetch.bind(w);
  w.fetch = (url, opts) => {
    const u = String((url && url.url) || url);
    if (u.includes("/api/templates/generate")) generateCalls++;
    if (u.includes("/api/templates/chat")){
      try { chatReqs.push(JSON.parse(opts && opts.body)); } catch (e) { chatReqs.push(null); }
      if (fetchHook) return fetchHook(url, opts);
    }
    return realFetch(url, opts);
  };
  const lastReq = () => chatReqs[chatReqs.length - 1];

  /* 챗봇 도구 (선택자는 구현 계획 Task 5 "화면 요소 약속" 표 기준) */
  const bots = () => qa("#chatLog .chat-msg.bot");
  const users = () => qa("#chatLog .chat-msg.user");
  const lastBot = () => bots().slice(-1)[0];
  const lastUser = () => users().slice(-1)[0];
  const loadingShown = () => vis($("chatLoading"));
  const enabledChoices = () => qa(".chat-choice").filter(b => !b.disabled).map(b => txt(b));
  const waitReply = (n) => waitFor(() => bots().length > n && !loadingShown());
  async function openChat(){
    if (!vis($("chatWin"))) need($("chatFab"), "#chatFab").click();
    await sleep(100);
    if (!vis($("chatWin"))) throw new Error("#chatWin 이 열리지 않음");
  }
  async function newChat(){
    w.confirm = () => true;
    await openChat();
    need($("chatNew"), "#chatNew").click();
    await sleep(150);
  }
  function typeInput(text){
    const inp = need($("chatInput"), "#chatInput");
    inp.value = text; inp.dispatchEvent(new w.Event("input", { bubbles: true }));
  }
  async function say(text){
    typeInput(text);
    const n = bots().length;
    need($("chatSend"), "#chatSend").click();
    if (!await waitReply(n)) throw new Error("응답 말풍선이 나타나지 않음: " + text);
  }
  async function clickChoice(label){
    const b = qa(".chat-choice").find(x => !x.disabled && txt(x) === label);
    need(b, "선택지 [" + label + "]");
    const n = bots().length;
    b.click();
    if (!await waitReply(n)) throw new Error("선택지 클릭 후 응답 없음: " + label);
  }
  async function clickStart(sel){
    const b = need(q(sel), sel);
    const n = bots().length;
    b.click();
    if (!await waitReply(n)) throw new Error("시작 선택지 클릭 후 응답 없음: " + sel);
  }
  function resetForm(){ w.confirm = () => true; $("resetBtn").click(); }
  /* 아이템리스트 항목 행을 [[항목명, 내용], ...]으로 채운다 (행이 모자라면 + 항목 추가) */
  function fillItemRows(rows){
    while ($("itemList").querySelectorAll(".item-row").length < rows.length) need($("addItem"), "#addItem").click();
    rows.forEach(([name, desc], i) => {
      const r = $("itemList").querySelectorAll(".item-row")[i];
      for (const [k, v] of [["name", name], ["desc", desc]]){
        const el = need(r.querySelector(`[data-ik=${k}]`), `${i + 1}번 항목 ${k}`);
        el.value = v; el.dispatchEvent(new w.Event("input", { bubbles: true }));
      }
    });
  }
  const itemRowVals = () => [...$("itemList").querySelectorAll(".item-row")].map(r => [(r.querySelector("[data-ik=name]") || {}).value, (r.querySelector("[data-ik=desc]") || {}).value]);
  const checkedVal = (name) => (d.querySelector(`input[name=${name}]:checked`) || {}).value;

  try {
  const SAMPLE_CONTENT = $("content").value;

  /* ---------- 0) 첫 화면: 챗봇은 닫혀 있고 왼쪽 아래 버튼만 보인다 ---------- */
  await block(["fabShownChatClosed"], async () => {
    const fab = $("chatFab"), win = $("chatWin");
    const r = fab && fab.getBoundingClientRect();
    rec("fabShownChatClosed", vis(fab) && !vis(win) && w.getComputedStyle(fab).position === "fixed" && r.left < 120 && w.innerHeight - r.bottom < 120,
      "fab=" + vis(fab) + " win=" + vis(win) + (r ? " pos=" + w.getComputedStyle(fab).position + " left=" + Math.round(r.left) + " bottomGap=" + Math.round(w.innerHeight - r.bottom) : ""));
  });
  rec("oldNlCardRemoved", ["nlPrompt", "nlGenerate", "nlStatus", "nlViolationActions", "nlScope", "nlApplyAnyway", "nlRetry"].every(id => !$(id)),
    ["nlPrompt", "nlGenerate", "nlStatus", "nlViolationActions", "nlScope", "nlApplyAnyway", "nlRetry"].filter(id => $(id)).join(",") || "removed");

  /* ---------- 수작업 기능 (기존 항목 유지) ---------- */
  w.document.querySelector("input[name=emph][value=NONE]").click();
  rec("emph text row not visible when NONE", !shown($("emphText")), w.getComputedStyle($("emphText")).display);
  w.document.querySelector("input[name=msgType][value=BA]").click();
  rec("extra field not visible when BA", !shown($("extraWrap")), w.getComputedStyle($("extraWrap")).display);
  $("resetBtn").click();
  rec("all msg types", [...d.querySelectorAll("input[name=msgType]")].map(r => r.value).join(",") === "BA,EX,AD,MI", "");
  rec("all emph types", [...d.querySelectorAll("input[name=emph]")].map(r => r.value).join(",") === "NONE,TEXT,IMAGE,ITEM_LIST", "");
  rec("button section exists", !!$("btnList") && !!$("addBtn"), "");
  rec("no review section", !$("result") && !$("payload") && !d.querySelector("button[type=submit]"), "");
  d.querySelector("input[name=msgType][value=AD]").click();
  rec("AD shows channel-add in preview", $("pvBubble").textContent.includes("채널 추가"), "");
  rec("AD channel-add text", $("pvBubble").textContent.includes("채널 추가하고 이 채널의 광고와 마케팅 메시지 받기"), "");
  rec("AD fixes first button as AC", $("btnList").textContent.includes("채널 추가 (AC)"), "");
  d.querySelector("input[name=emph][value=IMAGE]").click();
  rec("IMAGE shows image field", shown($("emphImage")), "");
  d.querySelector("input[name=emph][value=ITEM_LIST]").click();
  rec("ITEM_LIST shows item fields", shown($("emphItem")) && !shown($("emphImage")) && !shown($("emphText")), "");
  rec("ITEM_LIST starts with 2 rows", $("itemList").querySelectorAll(".item-row").length === 2, "rows=" + $("itemList").querySelectorAll(".item-row").length);
  for (let k = 0; k < 10; k++) $("addItem").click();
  rec("ITEM_LIST max 10 rows", $("itemList").querySelectorAll(".item-row").length === 10 && $("addItem").disabled, "rows=" + $("itemList").querySelectorAll(".item-row").length);
  $("itHeader").value = "주문 내역"; $("itHeader").dispatchEvent(new w.Event("input"));
  const firstDesc = $("itemList").querySelector("[data-ik=desc]");
  firstDesc.value = "#{상품명}"; firstDesc.dispatchEvent(new w.Event("input"));
  rec("ITEM_LIST header in preview", $("pvBubble").textContent.includes("주문 내역"), "");
  rec("ITEM_LIST item var gets sample input", !!$("vars").querySelector('[data-var="상품명"]'), "");
  $("itHeader").value = "가".repeat(17); $("itHeader").dispatchEvent(new w.Event("input"));
  rec("ITEM_LIST header counter over 16", $("cntItHeader").classList.contains("over"), $("cntItHeader").textContent);
  $("resetBtn").click();
  // Minor 1: 하이라이트 제목 안의 변수도 제목과 같은 글자 크기
  d.querySelector("input[name=emph][value=ITEM_LIST]").click();
  $("itHlTitle").value = "#{상품명} 외"; $("itHlTitle").dispatchEvent(new w.Event("input"));
  { const b = $("pvBubble").querySelector(".it-hl b"), v = b && b.querySelector(".vfill, .vtag");
    rec("hl title variable same font size", !!v && w.getComputedStyle(v).fontSize === w.getComputedStyle(b).fontSize, v ? w.getComputedStyle(v).fontSize + " vs " + w.getComputedStyle(b).fontSize : "no var"); }
  // Minor 3: 채널추가형 전환으로 6/5가 되면 초과 표시
  $("resetBtn").click();
  d.querySelector("input[name=msgType][value=BA]").click();
  for (let k = 0; k < 3; k++) $("addBtn").click();
  d.querySelector("input[name=msgType][value=AD]").click();
  rec("button count over marked", $("btnCount").textContent === "6/5" && $("btnCount").classList.contains("over"), $("btnCount").textContent + " " + $("btnCount").className);
  $("resetBtn").click();
  const before = $("btnList").querySelectorAll(".btn-item").length;
  $("addBtn").click();
  rec("add button works", $("btnList").querySelectorAll(".btn-item").length === before + 1, before + "→" + $("btnList").querySelectorAll(".btn-item").length);
  $("resetBtn").click();
  rec("preview rendered", $("pvBubble").textContent.includes("주문이 정상적으로"), $("pvBubble").textContent.slice(0, 40));
  rec("limits from /api/rules (vars 30)", $("varCount").textContent.includes("/30"), $("varCount").textContent);

  /* ---------- 1) 챗봇 열기: 왼쪽 아래, 미리보기와 겹치지 않음 ---------- */
  await block(["fabOpensChatBottomLeft", "chatHeaderHasTitleAndButtons", "startButtonsShown", "chatScopeNotice"], async () => {
    need($("chatFab"), "#chatFab").click();
    await sleep(150);
    const win = need($("chatWin"), "#chatWin"), r = win.getBoundingClientRect(), p = q(".preview").getBoundingClientRect();
    const overlap = !(r.right <= p.left || p.right <= r.left || r.bottom <= p.top || p.bottom <= r.top);
    rec("fabOpensChatBottomLeft",
      vis(win) && !vis($("chatFab")) && w.getComputedStyle(win).position === "fixed" && r.left >= 0 && r.left <= 40 && r.top >= 0 && w.innerHeight - r.bottom >= 0 && w.innerHeight - r.bottom <= 40 && r.width >= 320 && r.width <= 440 && !overlap,
      `win=${vis(win)} fab=${vis($("chatFab"))} rect=${Math.round(r.left)},${Math.round(r.top)} ${Math.round(r.width)}x${Math.round(r.height)} bottomGap=${Math.round(w.innerHeight - r.bottom)} previewLeft=${Math.round(p.left)} overlap=${overlap}`);
    rec("chatHeaderHasTitleAndButtons", txt(win).includes("알림톡 자동완성") && vis($("chatNew")) && vis($("chatMin")) && vis($("chatClose")) && vis($("chatInput")) && vis($("chatSend")) && !!$("chatLog") && !loadingShown(),
      `new=${vis($("chatNew"))} min=${vis($("chatMin"))} close=${vis($("chatClose"))} input=${vis($("chatInput"))} send=${vis($("chatSend"))} loading=${loadingShown()}`);
    const starts = qa(".chat-start[data-say]").filter(vis);
    const want = ["주문 완료", "주문 취소", "배송 시작", "예약 확정", "회원가입", "인증번호"];
    const polish = q(".chat-start[data-polish]");
    rec("startButtonsShown",
      txt(win).includes("어떤 알림톡 메시지를 만들까요?") && starts.map(txt).join(",") === want.join(",")
        && starts.every(b => b.dataset.say === txt(b) + " 안내 메시지" && !b.disabled)
        && vis(polish) && /다듬기/.test(txt(polish)) && !polish.disabled,
      "starts=" + starts.map(b => txt(b) + "→" + b.dataset.say).join(" / ") + " polish=" + (polish ? txt(polish) + (polish.disabled ? "(disabled)" : "") : "없음"));
    const sc = $("chatScope");
    // 문구 내용은 scopeTextUpdated에서 확인. 여기서는 챗봇 창 안에 보이는지와 버튼은 직접 설정한다는 안내만 본다
    rec("chatScopeNotice", vis(sc) && win.contains(sc) && /버튼/.test(txt(sc)),
      sc ? txt(sc) : "missing");
  });

  /* ---------- 2) 예시가 채워진 첫 화면에서 새 메시지 요청 → 새로 만들기로 폼 채움 ---------- */
  await block(["newRequestOnSampleFormFillsForm", "chatDraftClearsButtonsAndImages", "chatDraftUpdatesPreview"], async () => {
    let confirmCalls = 0;
    resetForm();
    d.querySelector("input[name=emph][value=ITEM_LIST]").click();
    await fakeImage($("itImg")); await fakeImage($("itThumb"));
    d.querySelector("input[name=emph][value=TEXT]").click(); // 텍스트 항목은 예시 그대로(덮어쓰기 확인 없음)
    w.confirm = () => { confirmCalls++; return true; };
    await openChat();
    await say("배송 안내 만들어줘");
    const req = lastReq();
    rec("newRequestOnSampleFormFillsForm",
      $("content").value.startsWith("[주문완료 안내]") && confirmCalls === 0 && txt(lastBot()).includes("주문 완료 안내를 작성했습니다")
        && !!req && !!req.form && req.form.content === SAMPLE_CONTENT && txt(lastUser()).includes("배송 안내 만들어줘"),
      "content=" + $("content").value.slice(0, 15) + " confirm=" + confirmCalls + " bot=" + txt(lastBot()).slice(0, 30) + " reqFormSample=" + !!(req && req.form && req.form.content === SAMPLE_CONTENT));
    const btns = $("btnList").querySelectorAll(".btn-item").length;
    d.querySelector("input[name=emph][value=ITEM_LIST]").click();
    rec("chatDraftClearsButtonsAndImages", btns === 0 && !$("pvBubble").querySelector("img") && $("itImg").value === "" && $("itThumb").value === "" && $("cntItHlTitle").textContent === "0/30",
      "buttons=" + btns + " img=" + !!$("pvBubble").querySelector("img") + " itImg=" + $("itImg").value + " cnt=" + $("cntItHlTitle").textContent);
    d.querySelector("input[name=emph][value=NONE]").click();
    rec("chatDraftUpdatesPreview", $("pvBubble").textContent.includes("홍길동") && $("extraWrap").hidden === false, $("pvBubble").textContent.slice(0, 40));
  });

  /* ---------- 3) 시작 선택지 → 질문·선택지 → 선택지 클릭 → 폼 채움 ---------- */
  await block(["startButtonAsksWithChoices", "choiceClickFillsForm", "oldChoicesDisabled", "chatRequestSendsHistoryAndForm"], async () => {
    resetForm();
    await newChat();
    await clickStart('.chat-start[data-say="배송 시작 안내 메시지"]');
    rec("startButtonAsksWithChoices",
      txt(lastUser()).includes("배송 시작 안내 메시지") && txt(lastBot()).includes("어떤 정보를 넣을까요?")
        && enabledChoices().join(",") === "택배사·송장번호,배송 예정일,상품명" && $("content").value === SAMPLE_CONTENT,
      "user=" + txt(lastUser()) + " bot=" + txt(lastBot()).slice(0, 30) + " choices=" + enabledChoices().join(","));
    w.confirm = () => true;
    await clickChoice("배송 예정일");
    rec("choiceClickFillsForm",
      txt(lastUser()).includes("배송 예정일") && $("content").value.startsWith("[주문완료 안내]") && d.querySelector("input[name=msgType][value=EX]").checked,
      "user=" + txt(lastUser()) + " content=" + $("content").value.slice(0, 15));
    const disabled = qa(".chat-choice").filter(b => b.disabled).map(txt);
    rec("oldChoicesDisabled",
      ["택배사·송장번호", "배송 예정일", "상품명"].every(t => disabled.includes(t)) && enabledChoices().join(",") === "고객센터 안내 추가,이대로 완료",
      "enabled=" + enabledChoices().join(",") + " disabled=" + disabled.join(","));
    const req = lastReq(), m = (req && req.messages) || [];
    rec("chatRequestSendsHistoryAndForm",
      m.length === 3 && m.map(x => x.role).join(",") === "user,assistant,user" && m[0].text === "배송 시작 안내 메시지"
        && m[1].text.includes("어떤 정보를 넣을까요?") && m[1].kind === "ASK" && m[2].text === "배송 예정일"
        && req.channel === $("channel").value && !!req.form && req.form.content === SAMPLE_CONTENT && req.form.msgType === "EX",
      JSON.stringify(m).slice(0, 160) + " channel=" + (req && req.channel));
  });

  /* ---------- 4) 접기·닫기는 창만 숨기고 대화 유지 ---------- */
  await block(["minimizeKeepsConversation"], async () => {
    await openChat();
    const nu = users().length, nb = bots().length;
    need($("chatMin"), "#chatMin").click(); await sleep(100);
    const minHidden = !vis($("chatWin")) && vis($("chatFab"));
    $("chatFab").click(); await sleep(100);
    const afterMin = vis($("chatWin")) && users().length === nu && bots().length === nb;
    need($("chatClose"), "#chatClose").click(); await sleep(100);
    const closeHidden = !vis($("chatWin")) && vis($("chatFab"));
    $("chatFab").click(); await sleep(100);
    const afterClose = vis($("chatWin")) && users().length === nu && bots().length === nb && enabledChoices().length === 2;
    rec("minimizeKeepsConversation", nu > 0 && minHidden && afterMin && closeHidden && afterClose,
      `users=${nu} minHidden=${minHidden} afterMin=${afterMin} closeHidden=${closeHidden} afterClose=${afterClose}`);
  });

  /* ---------- 5) 응답 대기 중 입력·버튼 잠금 (fetch를 1.5초 지연) ---------- */
  await block(["inputLockedWhileWaiting"], async () => {
    w.confirm = () => true;
    await openChat();
    fetchHook = async (url, opts) => { await sleep(1500); return realFetch(url, opts); };
    const nReq = chatReqs.length, nb = bots().length;
    const choice = qa(".chat-choice").find(b => !b.disabled && txt(b) === "이대로 완료");
    need(choice, "선택지 [이대로 완료]").click();
    await sleep(300);
    const ld = $("chatLoading");
    const lockedNow = vis(ld) && /작성 중/.test(txt(ld)) && $("chatInput").disabled && $("chatSend").disabled
      && qa(".chat-start").length > 0 && qa(".chat-start").every(b => b.disabled)
      && qa(".chat-choice").every(b => b.disabled);
    const detail = `loading=${vis(ld)}(${txt(ld)}) input=${$("chatInput").disabled} send=${$("chatSend").disabled} starts=${qa(".chat-start").filter(b => !b.disabled).length} enabled choices=${enabledChoices().length}`;
    // 잠긴 동안 다시 보내기·시작 버튼을 눌러도 요청이 늘지 않아야 한다
    typeInput("중복 전송"); $("chatSend").click();
    const st = q(".chat-start[data-say]"); if (st) st.click();
    await waitReply(nb);
    fetchHook = null;
    await sleep(200);
    const unlocked = !loadingShown() && !$("chatInput").disabled && !$("chatSend").disabled;
    rec("inputLockedWhileWaiting", lockedNow && chatReqs.length === nReq + 1 && unlocked,
      detail + ` requests=${chatReqs.length - nReq} unlockedAfter=${unlocked}`);
    typeInput("");
  });

  /* ---------- 6) 새 대화: 대화를 지우고 시작 선택지부터 (폼은 그대로) ---------- */
  await block(["newChatResets", "adRejectedShownInChat"], async () => {
    const contentBefore = $("content").value;
    await newChat();
    const cleared = users().length === 0 && qa(".chat-choice").length === 0 && qa(".chat-start[data-say]").filter(vis).length === 6
      && txt($("chatWin")).includes("어떤 알림톡 메시지를 만들까요?") && $("content").value === contentBefore;
    const clearedDetail = `users=${users().length} choices=${qa(".chat-choice").length} starts=${qa(".chat-start[data-say]").filter(vis).length} formKept=${$("content").value === contentBefore}`;
    await say("할인 광고 보내줘");
    const req = lastReq();
    rec("newChatResets", cleared && !!req && req.messages.length === 1, clearedDetail + " nextReqMessages=" + (req && req.messages.length));
    const lb = lastBot();
    rec("adRejectedShownInChat",

        && $("chatInput").disabled && $("chatSend").disabled,
      `req10Messages=${m10.length} limitEl=${!!lim} shown=${limitShown()} text=${txt(lim).slice(0, 40)} input=${$("chatInput").disabled} send=${$("chatSend").disabled}`);
    const choices = qa(".chat-choice"), starts = qa(".chat-start");
    rec("chatLimitDisablesChoices",
      choices.length > 0 && choices.every(b => b.disabled) && starts.length > 0 && starts.every(b => b.disabled),
      `choices=${choices.length} enabledChoices=${choices.filter(b => !b.disabled).map(txt).join(",")} starts=${starts.length} enabledStarts=${starts.filter(b => !b.disabled).length}`);
    // 한도 상태에서 보내기·Enter·선택지·시작 버튼을 눌러도 요청이 가지 않아야 한다 (disabled 여부와 상관없이 강제로 클릭)
    const nReq = chatReqs.length, nu = users().length;
    const inp = $("chatInput");
    const wasDisabled = inp.disabled;
    inp.disabled = false; typeInput("11번째 발화"); inp.disabled = wasDisabled;
    $("chatSend").click();
    inp.dispatchEvent(new w.KeyboardEvent("keydown", { key: "Enter", code: "Enter", keyCode: 13, which: 13, bubbles: true, cancelable: true }));
    for (const b of qa(".chat-choice, .chat-start")){ const dis = b.disabled; b.disabled = false; b.click(); b.disabled = dis; }
    await sleep(800);
    rec("chatLimitBlocksEleventhRequest", chatReqs.length === nReq && users().length === nu && !loadingShown(),
      `requests+${chatReqs.length - nReq} users+${users().length - nu} loading=${loadingShown()}`);
    inp.disabled = false; typeInput(""); inp.disabled = wasDisabled;
    const shownBeforeNew = limitShown();
    await newChat();
    const resetOk = shownBeforeNew && !limitShown() && !$("chatInput").disabled && !$("chatSend").disabled && users().length === 0
      && qa(".chat-start[data-say]").filter(vis).every(b => !b.disabled);
    const resetDetail = `shownBeforeNew=${shownBeforeNew} limitShown=${limitShown()} input=${$("chatInput").disabled} send=${$("chatSend").disabled} users=${users().length}`;
    const nReq2 = chatReqs.length;
    await say("배송 안내 만들어줘");
    rec("chatLimitResetByNewChat", resetOk && chatReqs.length === nReq2 + 1 && lastReq().messages.length === 1 && !limitShown(),
      resetDetail + ` afterSendRequests+${chatReqs.length - nReq2} msgs=${lastReq() && lastReq().messages.length}`);
  });
  fetchHook = null;

  rec("noGenerateApiCall", generateCalls === 0, "generate calls=" + generateCalls);

  /* ---------- 초기화 (기존 항목 유지) ---------- */
  resetForm();
  await sleep(300);
  rec("reset restores sample", $("content").value.includes("주문이 정상적으로"), "");
  rec("reset restores sample buttons", $("btnList").querySelectorAll(".btn-item").length === 2, "");

  // [특수문자 변수명] 이름에 < 가 있어도, 'constructor' 같은 이름이어도 예시값이 바르게 나온다
  $("resetBtn").click();
  d.querySelector("input[name=emph][value=NONE]").click();
  $("content").value = "안내 #{a<b} / #{constructor}"; $("content").dispatchEvent(new w.Event("input"));
  const sv = $("vars").querySelector('[data-var="a<b"]');
  if (sv) { sv.value = "특수값"; sv.dispatchEvent(new w.Event("input")); }
  rec("special-char variable shows sample", $("pvBubble").textContent.includes("특수값"), $("pvBubble").textContent.slice(0, 60));
  rec("builtin-name variable not filled", !/function|native code/.test($("pvBubble").textContent) && $("pvBubble").textContent.includes("#{constructor}"), $("pvBubble").textContent.slice(0, 80));
  $("resetBtn").click();
  } catch (e) { rec("harness error", false, String(e)); }
  rec("no js errors", errors.length === 0, errors.join(" | "));
  document.getElementById("out").textContent = "DONE " + JSON.stringify(results);
});
</script>
</body></html>
